[project]
name = "pmaso"
version = "0.1.0"
description = "Efficient Market Portfolio Exploration Tool"
authors = [
    {name = "Jordan-M-Young"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy (>=2.5.4,<3.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "pandas (>=3.1.1,<4.0.0)",
    "pyqt5 (>=5.15.11,<6.0.0)",
    "streamlit (>=1.67.0,<2.0.0)"
]

[project.scripts]
pmaso = "pmaso.qt_app:main"
app = "pmaso.app:main"
download = "scripts.download:main"
build_tickers = "scripts.build_tickers:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.17.5"
yfinance = "^1.8.0"
tqdm = "^4.70.1"

